name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # Permet de lancer le build manuellement

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            echo "gradlew manquant - le projet doit être ouvert une fois dans Android Studio pour générer le wrapper"
          fi

      - name: Create empty .env if needed
        run: |
          if [ ! -f .env ]; then
            echo "GEMINI_API_KEY=" > .env
          fi

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "Impossible de builder sans gradlew. Ouvre le projet dans Android Studio d'abord."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Assistant-Reunion-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
